  <g transform="translate(959,318)"><rect width="172" height="36" rx="18" fill="#4fd1c5" fill-opacity=".14" stroke="#4fd1c5" stroke-opacity=".55"/><text x="86" y="24" text-anchor="middle" font-size="16" fill="#e8ebf2">No dependencies</text></g>
